<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>교사 호출 시스템 - 장유고등학교</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #020617;
            --sidebar-bg: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #10b981; 
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0; background-color: var(--bg); color: var(--text-main);
            display: flex; height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none;
        }

        /* 반응형 모바일 스크롤 */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow-x: hidden;
                overflow-y: auto;
            }
            nav {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }
            main {
                overflow-y: visible;
            }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* 로그인 오버레이 */
        #login-overlay {
            position: fixed;
            inset: 0; background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            display: flex; justify-content: center; align-items: center; z-index: 5000;
        }
        .login-box {
            background: var(--sidebar-bg);
            padding: 3rem; border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 1.2rem; margin-bottom: 1rem; background: #1e293b;
            border: 1px solid #334155; border-radius: 1rem; color: white; font-size: 1.1rem;
        }
        .login-box button {
            width: 100%;
            padding: 1.2rem; background: var(--primary); color: white;
            border: none; border-radius: 1rem; font-weight: 800; cursor: pointer; font-size: 1.2rem;
        }

        /* 사이드바 */
        nav {
            width: 240px;
            background: var(--sidebar-bg); padding: 2.5rem 1.5rem;
            display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0; text-align: center;
        }
        .sidebar-header { margin-bottom: 3rem; }
        .sidebar-header h1 { font-size: 1.6rem; font-weight: 800; margin: 0; color: white; line-height: 1.2; }
        .sidebar-header p { font-size: 1rem; color: var(--text-dim); margin-top: 8px; font-weight: 600; }

        .menu-item {
            padding: 1.2rem;
            border-radius: 1rem; cursor: pointer; margin-bottom: 0.8rem;
            color: var(--text-dim); font-weight: 700; transition: 0.2s;
            font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
            border: 1px solid transparent; white-space: nowrap;
        }
        .menu-item:hover { background: rgba(255,255,255,0.05); }
        .menu-item.active { background: rgba(99, 102, 241, 0.15); border: 1px solid var(--primary); color: var(--primary); }

        /* 메인 컨텐츠 */
        main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; padding: 2rem; }

        /* 부서 대시보드 */
        #dashboard-view { flex: 1; display: flex; flex-direction: column; text-align: center; }
        .dashboard-title {
            display: inline-block;
            width: 100%; text-align: center; font-size: 2.2rem; font-weight: 800; color: var(--accent);
            margin-bottom: 2rem; background: rgba(16, 185, 129, 0.1); padding: 15px;
            border-radius: 1rem;
            animation: fadeIn 0.5s ease-out;
        }
        #dept-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem; overflow-y: auto; padding-bottom: 2rem;
        }
        .dept-card {
            background: var(--card-bg);
            padding: 3rem 2rem; border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.05); cursor: pointer; text-align: center;
            transition: 0.3s;
        }
        .dept-card:hover { transform: translateY(-10px); border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .dept-card h3 { font-size: 1.8rem; margin: 0; color: #fff; font-weight: 900; }

        /* 배치도 컨테이너 */
        #grid-view { flex: 1; display: none; flex-direction: column; height: 100%; }
        #grid-outer-container {
            flex: 1;
            width: 100%; height: 100%; position: relative;
            background: rgba(15, 23, 42, 0.5); border-radius: 2.5rem; 
            overflow: hidden; display: flex; align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #grid-wrapper { position: relative; display: inline-block; transition: transform 0.1s ease-out; transform-origin: center center; }
        #grid-container { display: grid; position: relative; z-index: 10; }

        /* 좌석 카드 */
        .seat-card {
            background: #1e293b;
            border-radius: 1.2rem; text-align: center;
            border: 2px solid #334155; display: flex; flex-direction: column; justify-content: center;
            transition: 0.2s; cursor: pointer; position: relative;
            z-index: 10; padding: 10px;
        }
        .seat-card h3 { font-size: 3.5rem; margin: 0; font-weight: 900; color: #fff; line-height: 1.1; }
        .seat-card p { font-size: 1.8rem; color: #facc15; margin: 12px 0 0 0; font-weight: 800; }
        .seat-card.disabled { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        .seat-card.empty { background: rgba(255,255,255,0.02); border: 2px dashed rgba(255,255,255,0.1); cursor: default; }

        /* 파티션 */
        .partition { position: absolute; background: #64748b; z-index: 5; pointer-events: none; opacity: 1; border-radius: 3px; }
        .partition-trigger { position: absolute; background: transparent; cursor: pointer; z-index: 30; display: none; }
        .edit-mode .partition-trigger { display: block; }

        /* 안내 문구 */
        #call-instruction {
            text-align: center;
            font-size: 2.2rem; font-weight: 800; color: var(--accent);
            margin-bottom: 1.5rem; animation: fadeIn 0.5s ease-out;
            background: rgba(16, 185, 129, 0.1); padding: 15px;
            border-radius: 1rem;
        }

        /* 팝업 */
        #call-popup {
            display: none;
            position: fixed; inset: 0; background: rgba(2, 6, 23, 0.98);
            z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
            border: 20px solid var(--primary); text-align: center;
        }
        .popup-content h1 { font-size: 16rem; margin: 0; color: white; animation: pulse 1s infinite; font-weight: 900; }
        .popup-content p { font-size: 4rem; color: var(--text-dim); font-weight: 800; margin-top: 2rem; }

        /* 수신 모니터 + 급식 정보 */
        #teacher-view {
            display: none; flex: 1; flex-direction: column; align-items: center;
            justify-content: flex-start; width: 100%; height: 100%; gap: 1.3rem;
        }
        .monitor-box {
            width: 96%; min-height: 110px; display: flex; align-items: center; justify-content: space-between;
            background: var(--sidebar-bg); border-radius: 1.8rem; border: 2px solid var(--primary);
            box-shadow: 0 0 28px var(--primary-glow); padding: 1.2rem 2rem;
            flex-shrink: 0;
        }
        .monitor-title-wrap { display: flex; align-items: baseline; gap: 1rem; min-width: 0; }
        .monitor-label { color: var(--text-dim); font-size: 1.15rem; font-weight: 700; white-space: nowrap; }
        #monitor-status { font-size: 2.6rem; font-weight: 900; margin: 0; color: white; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .monitor-badge { color: var(--accent); font-size: 1.35rem; font-weight: 800; display: flex; align-items: center; gap: 0.7rem; white-space: nowrap; }
        .monitor-badge.status-connected { color: var(--accent); }
        .monitor-badge.status-connecting { color: #facc15; }
        .monitor-badge.status-error { color: var(--danger); }
        .monitor-badge.status-disconnected { color: var(--text-dim); }

        .monitor-badge.status-connected .dot { background: var(--accent); }
        .monitor-badge.status-connecting .dot { background: #facc15; }
        .monitor-badge.status-error .dot { background: var(--danger); }
        .monitor-badge.status-disconnected .dot { background: var(--text-dim); }
        .dot { width: 16px; height: 16px; background: var(--accent); border-radius: 50%; animation: pulse 1s infinite; flex-shrink: 0; }

        #meal-panel {
            width: 96%; flex: 1; min-height: 0; background: var(--sidebar-bg);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 2.2rem;
            padding: 2rem 2.4rem; display: flex; flex-direction: column; overflow: hidden;
        }
        .meal-header { display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin-bottom:1.3rem; flex-shrink:0; }
        .meal-title { font-size: 2.6rem; font-weight: 900; margin:0; color:#fff; }
        .meal-meta { color:var(--text-dim); font-size:1.15rem; font-weight:700; text-align:right; }
        #meal-content { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; justify-content:center; }
        .meal-menu-list { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:1rem 1.25rem; width:100%; }
        .meal-menu-item { background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.06); border-radius:1rem; padding:1.15rem 1.25rem; font-size:2.1rem; font-weight:850; line-height:1.35; display:flex; align-items:center; justify-content:center; text-align:center; min-height:84px; }
        .meal-empty { font-size:2.3rem; font-weight:900; color:var(--text-dim); text-align:center; }
        .meal-loading { font-size:1.6rem; font-weight:800; color:var(--text-dim); text-align:center; }
        .meal-error { font-size:1.4rem; font-weight:800; color:var(--danger); text-align:center; line-height:1.6; }

        @media (max-width: 768px) {
            .monitor-box { width:100%; border-radius:1.2rem; padding:1rem 1.2rem; flex-direction:column; align-items:flex-start; gap:0.8rem; }
            #monitor-status { font-size:2rem; }
            .monitor-badge { font-size:1.05rem; }
            #meal-panel { width:100%; border-radius:1.2rem; padding:1.3rem; }
            .meal-title { font-size:2rem; }
            .meal-menu-list { grid-template-columns:repeat(3, minmax(0, 1fr)); gap:0.65rem; }
            .meal-menu-item { font-size:1.25rem; padding:0.8rem 0.55rem; min-height:66px; }
        }


        /* 급식 정보 표시 ON/OFF 토글 */
        #meal-toggle-wrap {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            margin: -0.3rem 0 0.9rem 0;
            padding: 0.85rem 0.9rem;
            border-radius: 1rem;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text-dim);
            font-size: 0.95rem;
            font-weight: 800;
        }
        #meal-toggle-wrap .toggle-text {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            white-space: nowrap;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 30px;
            flex-shrink: 0;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #334155;
            transition: 0.2s;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.10);
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            top: 3px;
            background: white;
            transition: 0.2s;
            border-radius: 50%;
        }
        .switch input:checked + .slider {
            background: var(--accent);
        }
        .switch input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* 급식 OFF: 예전 수신 모니터 화면처럼 크게 중앙 배치 */
        #teacher-view.meal-off {
            justify-content: center;
        }
        #teacher-view.meal-off #meal-panel {
            display: none;
        }
        #teacher-view.meal-off .monitor-box {
            width: 90%;
            height: 80%;
            min-height: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4rem;
            border-width: 4px;
            padding: 2rem;
            box-shadow: 0 0 50px var(--primary-glow);
            text-align: center;
        }
        #teacher-view.meal-off .monitor-title-wrap {
            flex-direction: column;
            align-items: center;
            gap: 1.3rem;
        }
        #teacher-view.meal-off .monitor-label {
            font-size: 2rem;
        }
        #teacher-view.meal-off #monitor-status {
            font-size: 10rem;
            line-height: 1;
            overflow: visible;
            text-overflow: clip;
        }
        #teacher-view.meal-off .monitor-badge {
            font-size: 2.5rem;
            margin-top: 3rem;
            gap: 1rem;
        }
        #teacher-view.meal-off .dot {
            width: 25px;
            height: 25px;
        }

        @media (max-width: 768px) {
            #meal-toggle-wrap {
                margin-top: 0;
            }
            #teacher-view.meal-off .monitor-box {
                width: 100%;
                height: 72vh;
                border-radius: 2rem;
            }
            #teacher-view.meal-off #monitor-status {
                font-size: 5rem;
            }
            #teacher-view.meal-off .monitor-label {
                font-size: 1.4rem;
            }
            #teacher-view.meal-off .monitor-badge {
                font-size: 1.5rem;
            }
        }

        #toast {
            position: fixed;
            bottom: 40px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; padding: 1rem 3rem; border-radius: 3rem;
            font-weight: 800; z-index: 10000;
            display: none; font-size: 1.2rem;
        }

        #edit-modal {
            display: none;
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 6000; align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--sidebar-bg);
            padding: 3rem; border-radius: 2rem; width: 500px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    
        #meal-meta {
            font-size: 1.9rem;
            font-weight: 900;
            color: #facc15;
        }

        /* 현재 급식이 없을 때 표시되는 다음 급식 영역 */
        .meal-no-service {
            text-align:center; font-size:2rem; font-weight:900; color:var(--text-dim);
            margin-bottom:1.35rem; flex-shrink:0;
        }
        .next-meal-wrap {
            width:100%; display:flex; flex-direction:column; gap:1rem;
        }
        .next-meal-header {
            display:flex; justify-content:space-between; align-items:flex-end; gap:1rem;
            padding-top:1.1rem; border-top:1px solid rgba(255,255,255,0.10);
        }
        .next-meal-title {
            font-size:2rem; font-weight:900; color:var(--accent);
        }
        .next-meal-calorie {
            font-size:1.8rem; font-weight:900; color:#facc15; white-space:nowrap;
        }
        .next-meal-none {
            font-size:1.55rem; font-weight:800; color:var(--text-dim);
            text-align:center; margin-top:0.5rem;
        }

    </style>
</head>
<body oncontextmenu="return false">

    <div id="toast">알림</div>

    <!-- 로그인 오버레이 -->
    <div id="login-overlay">
        <div class="login-box">
            <h1 style="color:white; font-size:2.5rem; font-weight:900; margin-bottom:0.5rem;">교사 호출 시스템</h1>
            <p style="color:var(--text-dim); margin-bottom:3rem; font-size:1.2rem; font-weight:700;">장유고등학교</p>
            <input type="text" id="login-id" placeholder="아이디">
            <input type="password" id="login-pw" placeholder="비밀번호">
            <button id="login-submit-btn">시스템 접속</button>
            <p id="login-error" style="color: var(--danger); margin-top: 1.5rem; display: none; font-weight: 700;"></p>
        </div>
    </div>

    <nav id="sidebar" style="display: none;">
        <div class="sidebar-header">
            <h1>교사 호출 시스템</h1>
            <p>장유고등학교</p>
        </div>
   
        <div id="btn-student" class="menu-item" onclick="switchMode('student')">🏢 부서별 호출</div>
        <div id="btn-teacher" class="menu-item" onclick="switchMode('teacher')">🔔 실시간 수신 모니터</div>

        <div id="meal-toggle-wrap">
            <span class="toggle-text">🍽️ 급식정보 표시</span>
            <label class="switch" aria-label="급식정보 표시 ON/OFF">
                <input type="checkbox" id="meal-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div id="btn-edit" class="menu-item" onclick="switchMode('edit')">🛠️ 배치도 편집</div>
        
        <div style="margin-top: auto; margin-bottom: 0.8rem; color: var(--text-dim); font-size: 0.85rem; font-weight: 600; line-height: 1.4;">
            v2.0<br>ⓒ 2026. 홍정보 x ChatGPT
        </div>

        <!-- 전체화면 토글 버튼 추가 -->
        <button id="btn-fullscreen" onclick="toggleFullScreen()" style="background: rgba(99, 102, 241, 0.15); border: 1px solid var(--primary); color: var(--primary); padding: 1rem; border-radius: 1rem; cursor: pointer; font-weight: 800; font-size: 1rem; width: 100%; margin-bottom: 0.8rem;">⛶ 전체화면 전환</button>
        <button onclick="logoutApp()" style="background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 1.2rem; border-radius: 1rem; cursor: pointer; font-weight: 800; font-size: 1.1rem; width: 100%;">로그아웃</button>
    </nav>

    <main id="main-content" style="display: none;">
        <div id="dashboard-view">
            <div class="dashboard-title">부서를 선택해 주세요</div>
            <div id="dept-dashboard"></div>
        </div>

        <div id="grid-view">
            <div id="edit-header" style="display: none; background: #1e293b; padding: 1.2rem; border-radius: 1.5rem; margin-bottom: 1.5rem; align-items: center; gap: 1.5rem; border: 2px solid var(--primary);">
                <div style="display:flex; align-items:center; gap:0.8rem; font-weight:700;">
                    <span>행:</span>
                    <input type="number" id="input-rows" value="4" style="width:60px; padding: 5px; background:#0f172a; border:1px solid #334155; color:white; font-size:1.1rem;">
                    <span>열:</span>
                    <input type="number" id="input-cols" value="6" style="width:60px; padding: 5px; background:#0f172a; border:1px solid #334155; color:white; font-size:1.1rem;">
                    <button onclick="updateGridSize()" style="background:#334155; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer; font-weight:700;">그리드 적용</button>
                </div>
                <div style="flex:1; text-align:right;">
                    <button onclick="saveAllSettings()" style="background:var(--primary); color:white; border:none; padding:12px 24px; border-radius:12px; font-weight:800; cursor:pointer; font-size:1.1rem;">배치도 최종 저장</button>
                </div>
            </div>
            
            <div id="grid-header-row" style="display:flex; justify- space-between; align-items: center; margin-bottom:1.5rem; gap: 20px;">
                <button onclick="showDashboard()" style="background:rgba(99, 102, 241, 0.1); border:1px solid var(--primary); color:var(--primary); padding: 0.8rem 1.5rem; border-radius: 1rem; font-weight:800; cursor:pointer; font-size: 1.1rem; flex-shrink: 0;">◀ 부서 목록으로</button>
                <h2 id="view-title" style="margin:0; font-weight:900; font-size: 2.5rem; color: var(--primary); text-align: right; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">부서명</h2>
            </div>

            <div id="call-instruction" style="display:none;">아래의 선생님 이름을 누르면 호출됩니다.</div>

            <div id="grid-outer-container">
                <div id="grid-wrapper">
                    <div id="grid-container"></div>
                    <div id="partition-layer" style="position: absolute; inset: 0; pointer-events:none;"></div>
                </div>
            </div>
        </div>

        <div id="teacher-view">
            <div class="monitor-box">
                <div class="monitor-title-wrap">
                    <span class="monitor-label">현재 수신 부서 :</span>
                    <h1 id="monitor-status">부서명</h1>
                </div>
                <div class="monitor-badge" id="realtime-badge">
                    <div class="dot" id="realtime-dot"></div>
                    <span id="realtime-status-text">실시간 호출 연결 중...</span>
                </div>
            </div>

            <section id="meal-panel" aria-live="polite">
                <div class="meal-header">
                    <h2 id="meal-title" class="meal-title">급식 정보</h2>
                    <div id="meal-meta" class="meal-meta"></div>
                </div>
                <div id="meal-content">
                    <div class="meal-loading">급식 정보를 불러오는 중입니다...</div>
                </div>
            </section>
        </div>

        <div id="call-popup">
            <div class="popup-content">

            // ===== 급식 기능 설정 =====

            const NEIS_API_KEY = '742ac295c086413381149b06a2d68d32';
            const NEIS_OFFICE_CODE = 'S10';

            const MEAL_CHECK_INTERVAL = 5 * 60 * 1000; // 5분마다 안전용 로컬 시간 확인
            const NEXT_MEAL_SEARCH_DAYS = 14; // 급식이 없을 때 최대 14일 안에서 다음 급식 탐색
            const MEAL_CACHE_TTL = 6 * 60 * 60 * 1000; // 급식 DB 캐시 유효시간: 6시간

            let currentUser = null, currentMode = 'student', currentDept = null;
            let gridRows = 4, gridCols = 6, partitions = { v: [], h: [] };
            let localTeachers = [], activeEditCell = { r: 0, c: 0 }, realTimeChannel = null;
            let isCallingLock = false;
            let mealTimer = null;

            let dailyReloadTimer = null;
            let lastMealViewKey = '';
            let mealDisplayEnabled = localStorage.getItem('tc_meal_display') !== 'off';

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // 1. 초기화 및 이벤트 리스너 등록
            window.onload = function() {
                // 페이지가 실제로 새로 로드된 경우에는 그 자체를 브라우저 초기화로 인정합니다.
                // 따라서 오전 4시 이후 새로 접속한 페이지가 불필요하게 한 번 더 reload되지 않습니다.
                markDailyReloadIfFreshLoad();

                document.getElementById('login-submit-btn').onclick = attemptLogin;
                
                const loginId = document.getElementById('login-id');
                const loginPw = document.getElementById('login-pw');
                [loginId, loginPw].forEach(el => el.onkeydown = e => { if(e.key === 'Enter') attemptLogin(); });

                window.addEventListener('resize', autoScale);

                // 급식정보 표시 토글 초기화 (처음 사용하는 기기는 기본 ON)
                const mealToggle = document.getElementById('meal-toggle');
                if (mealToggle) {
                    mealToggle.checked = mealDisplayEnabled;
                    mealToggle.addEventListener('change', () => {
                        setMealDisplayEnabled(mealToggle.checked);

                }
                applyMealDisplayMode();

                // 급식 화면은 상시 태블릿 운용을 고려해 5분마다 '로컬 시간'만 확인합니다.
                // 실제 DB/API 조회는 표시 대상(날짜/중식/석식)이 바뀔 때만 실행됩니다.
                mealTimer = setInterval(() => {
                    if (mealDisplayEnabled && currentMode === 'teacher' && currentDept) refreshMealDisplay();
                }, MEAL_CHECK_INTERVAL);

                // 13:30 / 18:30 / 00:00에는 5분 주기를 기다리지 않고 즉시 화면을 전환합니다.
                scheduleNextMealBoundary();

                // 장기간 켜두는 태블릿의 브라우저/Realtime 상태를 매일 한 번 깨끗하게 초기화합니다.
                scheduleDailyReload();

                // 화면 전환(슬립 복구) 시 오디오 및 실시간 채널 복원
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        // 태블릿이 절전 상태여서 새벽 4시 reload를 놓쳤다면,
                        // 화면을 다시 켠 순간 딱 한 번 reload하여 장기 실행 상태를 초기화합니다.
                        if (checkMissedDailyReload()) return;

                        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                        if (currentMode === 'teacher' && currentDept) {
                            startListening();
                            if (mealDisplayEnabled) refreshMealDisplay(true);
                            scheduleNextMealBoundary();
                            scheduleDailyReload();
                        }

                });

                // 전체화면 상태 변경 감지 이벤트
                document.addEventListener('fullscreenchange', () => {
                    const btn = document.getElementById('btn-fullscreen');
                    if (btn) {
                        btn.innerText = document.fullscreenElement ? '❌ 전체화면 해제' : '⛶ 전체화면 전환';
                    }
                });

                // 저장된 로그인 세션 복구
                const savedUser = localStorage.getItem('tc_saved_user');
                if (savedUser) {
                    try {
                        currentUser = JSON.parse(savedUser);
                        initApp();
                    } catch(e) {
                        localStorage.removeItem('tc_saved_user');
                    }
                }
            };


            // 급식정보 표시 ON/OFF
            // OFF일 때는 급식 패널을 숨기고 기존 수신 모니터 형태로 복원합니다.
            // 설정은 이 태블릿/브라우저의 localStorage에 저장됩니다.
            function applyMealDisplayMode() {
                const teacherView = document.getElementById('teacher-view');
                const mealToggle = document.getElementById('meal-toggle');

                if (mealToggle) mealToggle.checked = mealDisplayEnabled;
                if (!teacherView) return;

                teacherView.classList.toggle('meal-off', !mealDisplayEnabled);
            }

            function setMealDisplayEnabled(enabled) {
                mealDisplayEnabled = Boolean(enabled);
                localStorage.setItem('tc_meal_display', mealDisplayEnabled ? 'on' : 'off');
                applyMealDisplayMode();

                if (mealDisplayEnabled) {
                    lastMealViewKey = '';
                    if (mealDisplayEnabled && currentMode === 'teacher' && currentDept) {
                        refreshMealDisplay(true);
                    }
                    showToast('급식정보 표시 ON');
                } else {
                    showToast('급식정보 표시 OFF');
                }
            }

            // 전체화면 토글 함수
            window.toggleFullScreen = function() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        showToast("전체화면을 지원하지 않는 브라우저 환경입니다.");
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            };

            function playChime() {
                const playNote = (freq, start, duration) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, start);
                    gain.gain.setValueAtTime(0.3, start); 
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(start);
                    osc.stop(start + duration);
                };
                const now = audioCtx.currentTime;
                playNote(783.99, now, 0.8);  // G5
                playNote(659.25, now + 0.4, 1.2); // E5
            }

            function getKSTTime() {
                const now = new Date();
                const offset = now.getTimezoneOffset() * 60000;
                const kstDate = new Date(now.getTime() - offset + (9 * 3600000));
                const pad = (n) => n.toString().padStart(2, '0');
                const ms = now.getMilliseconds().toString().padStart(3, '0').substring(0, 2);

                return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}.${ms}`;
            }

            async function attemptLogin() {
                const id = document.getElementById('login-id').value;
                const pw = document.getElementById('login-pw').value;
                if(!id || !pw) return;

                const { data } = await _supabase.from('t_user').select('*').eq('user_id', id).eq('user_pw', pw).maybeSingle();
                if (data) { 
                    currentUser = data;
                    localStorage.setItem('tc_saved_user', JSON.stringify(data));
                    initApp(); 
                } else {

                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('main-content').style.display = 'flex';

                    const el = document.getElementById(id);

                if (currentUser.grade == 1) { 
                    ['btn-student', 'btn-teacher', 'btn-edit'].forEach(id => document.getElementById(id).style.display = 'flex');
                    if (mealToggleWrap) mealToggleWrap.style.display = 'flex';
                    switchMode('student');
                } else if (currentUser.grade == 2) { 
                    document.getElementById('btn-teacher').style.display = 'flex';
                    if (mealToggleWrap) mealToggleWrap.style.display = 'flex';
                    switchMode('teacher');
                } else { 
                    document.getElementById('btn-student').style.display = 'flex';
                    switchMode('student');
                }
            }

            async function fetchDeptList() {
                const { data } = await _supabase.from('t_dept').select('name');
                const container = document.getElementById('dept-dashboard');
                if(!data) return;
                container.innerHTML = data.map(dept => `
                    <div class="dept-card" onclick="selectDept('${dept.name}')">

            window.selectDept = async function(deptName) {
                currentDept = deptName;
                document.getElementById('view-title').innerText = deptName;
                document.getElementById('dashboard-view').style.display = 'none';
                
                const instruction = document.getElementById('call-instruction');

                    document.getElementById('teacher-view').style.display = 'flex';

                    document.getElementById('grid-view').style.display = 'flex';

            async function loadDeptData() {
                const { data: pData } = await _supabase.from('t_partition').select('*').eq('dept', currentDept).maybeSingle();
                if (pData) { 
                    gridRows = pData.rows || 4; 
                    gridCols = pData.cols || 6; 
                    partitions = pData.partitions || { v: [], h: [] };
                } else { 
                    gridRows = 4;
                    gridCols = 6; 
                    partitions = { v: [], h: [] };
                }
                const { data: tData } = await _supabase.from('t_teacher').select('*').eq('dept', currentDept);

            function renderGrid() {
                const container = document.getElementById('grid-container');
                const wrapper = document.getElementById('grid-wrapper');
                container.innerHTML = '';
                if (currentMode === 'edit') wrapper.classList.add('edit-mode'); else wrapper.classList.remove('edit-mode');

                container.style.gridTemplateColumns = `repeat(${gridCols}, ${cardW}px)`;

                renderPartitions(cardW, cardH, gap);

            // ★ 학생측 호출 발송 (동기화 로직 적용)
            async function initiateCall(name) {
                if(isCallingLock) return;
                isCallingLock = true;
                renderGrid();

                const popup = document.getElementById('call-popup');
                document.getElementById('popup-name').innerText = name;
                document.getElementById('popup-status').innerText = "선생님을 호출 중입니다...";

                await _supabase.from('t_calls').insert([{ name, dept: currentDept, call_time: getKSTTime() }]);

                // DB 전송 시간을 차감하여 정확히 4.5초에 맞춰 팝업을 닫음
                const elapsed = Date.now() - startTime;
                const remainingTime = Math.max(1000, 4500 - elapsed);

                setTimeout(() => { 
                    popup.style.display = 'none'; 
                    isCallingLock = false; 
                    renderGrid(); 
                }, remainingTime);
            }

            // ★ 교사측 수신 화면 (4.5초로 통일 및 음성출력 속도 동기화)
            function triggerCallEffect(name) {
                if(currentMode !== 'teacher') return;
                const popup = document.getElementById('call-popup');
                document.getElementById('popup-name').innerText = name;
                document.getElementById('popup-status').innerText = "선생님, 호출입니다!";
                document.getElementById('popup-status').style.color = "var(--accent)";
                popup.style.display = 'flex';
                
                playChime();
                if ('speechSynthesis' in window) {
                    setTimeout(() => {
                        const msg = new SpeechSynthesisUtterance(`${name} 선생님.`);
                        msg.lang = 'ko-KR'; msg.rate = 0.9;
                        window.speechSynthesis.speak(msg);

                }

                // 학생 측과 동일하게 4.5초 후 팝업 닫기
                setTimeout(() => { popup.style.display = 'none'; }, 4500);
            }

            // ===== 급식 정보 기능 =====
            // 표시 정책:
            // 00:00 ~ 13:29 = 오늘 중식
            // 13:30 ~ 18:29 = 오늘 석식
            // 18:30 ~ 23:59 = 내일 중식
            //
            // 데이터 정책:
            // 1) t_meals를 먼저 조회
            // 2) 해당 날짜 데이터가 없으면 NEIS API 호출
            // 3) 중식/석식을 t_meals에 UPSERT
            // 4) 현재 끼니가 없으면 다음 실제 급식을 찾아 함께 표시
            function getMealTarget() {
                const now = new Date();
                let targetDate = new Date(now);
                let mealType = 2;
                let label = '오늘의 중식';

                const minutes = now.getHours() * 60 + now.getMinutes();

                if (minutes < 13 * 60 + 30) {
                    mealType = 2;
                    label = '오늘의 중식';
                } else if (minutes < 18 * 60 + 30) {
                    mealType = 3;
                    label = '오늘의 석식';
                } else {
                    targetDate.setDate(targetDate.getDate() + 1);
                    mealType = 2;
                    label = '내일의 중식';
                }

                return {
                    date: formatLocalDate(targetDate),
                    mealType,
                    label
                };
            }

            // ===== 매일 새벽 04:00 브라우저 초기화 =====
            // - 화면이 켜져 있으면 04:00에 자동 reload
            // - 태블릿 절전으로 04:00을 놓쳤으면, 이후 화면 복귀 시 1회 reload
            // - 실제로 새로 페이지를 연 경우에는 그 로드 자체를 오늘의 초기화로 인정
            function getLocalDateKey(date = new Date()) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            function markDailyReloadIfFreshLoad() {
                const now = new Date();
                if (now.getHours() >= 4) {
                    localStorage.setItem('tc_last_daily_reload', getLocalDateKey(now));
                }
            }

            function checkMissedDailyReload() {
                const now = new Date();

                // 새벽 4시 이전에는 오늘의 초기화 시각이 아직 오지 않았으므로 아무것도 하지 않음
                if (now.getHours() < 4) return false;

                const todayKey = getLocalDateKey(now);
                const lastReloadKey = localStorage.getItem('tc_last_daily_reload');

                if (lastReloadKey !== todayKey) {
                    // reload 전에 먼저 기록해서 무한 reload를 방지합니다.
                    localStorage.setItem('tc_last_daily_reload', todayKey);
                    location.reload();
                    return true;
                }

                return false;
            }

            function scheduleDailyReload() {
                if (dailyReloadTimer) clearTimeout(dailyReloadTimer);

                const now = new Date();
                const nextReload = new Date(now);
                nextReload.setHours(4, 0, 0, 0);

                if (nextReload <= now) {
                    nextReload.setDate(nextReload.getDate() + 1);
                }

                const delay = Math.max(1000, nextReload.getTime() - now.getTime());

                dailyReloadTimer = setTimeout(() => {
                    // 정시 reload 역시 먼저 날짜를 기록하여 재로드 루프를 방지합니다.
                    localStorage.setItem('tc_last_daily_reload', getLocalDateKey(new Date()));
                    location.reload();
                }, delay);
            }

            // 다음 화면 변경 시각(13:30 / 18:30 / 00:00)에 정확히 한 번 실행.
            // 5분 주기 체크는 태블릿 절전/브라우저 지연 등에 대비한 안전장치로 계속 유지합니다.
            function scheduleNextMealBoundary() {
                if (mealBoundaryTimer) clearTimeout(mealBoundaryTimer);

                const now = new Date();
                const today1330 = new Date(now);
                today1330.setHours(13, 30, 0, 0);

                const today1830 = new Date(now);
                today1830.setHours(18, 30, 0, 0);

                const nextMidnight = new Date(now);
                nextMidnight.setDate(nextMidnight.getDate() + 1);
                nextMidnight.setHours(0, 0, 0, 0);

                let nextBoundary;
                if (now < today1330) nextBoundary = today1330;
                else if (now < today1830) nextBoundary = today1830;
                else nextBoundary = nextMidnight;

                const delay = Math.max(1000, nextBoundary.getTime() - now.getTime() + 1000);

                mealBoundaryTimer = setTimeout(() => {
                    lastMealViewKey = '';
                    if (mealDisplayEnabled && currentMode === 'teacher' && currentDept) {
                        refreshMealDisplay(true);
                    }
                    scheduleNextMealBoundary();
                }, delay);
            }

            function formatLocalDate(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            function addDays(dateText, days) {
                const [y, m, d] = dateText.split('-').map(Number);
                const date = new Date(y, m - 1, d);
                date.setDate(date.getDate() + days);
                return formatLocalDate(date);
            }

            function formatNeisDate(dateText) {
                return dateText.replaceAll('-', '');
            }

            function formatKoreanDate(dateText) {
                const [y, m, d] = dateText.split('-').map(Number);
                const date = new Date(y, m - 1, d);
                const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
                return `${y}. ${m}. ${d}.(${weekdays[date.getDay()]})`;
            }

            function getMealEmoji(mealType) {
                return Number(mealType) === 3 ? '🌙' : '☀️';
            }

            function getMealTypeName(mealType) {
                return Number(mealType) === 3 ? '석식' : '중식';
            }

            function getMealTitle(target) {
                return `${getMealEmoji(target.mealType)} ${target.label} - ${formatKoreanDate(target.date)}`;
            }

            function getNextMealTitle(meal) {
                return `${getMealEmoji(meal.meal_type)} 다음 급식 · ${formatKoreanDate(meal.meal_date)} ${getMealTypeName(meal.meal_type)}`;
            }

            // ===== 급식 메뉴 전처리 =====
            // NEIS 원본의 알레르기 번호, 표준/자율 표기 등 화면에 불필요한 문자를 제거합니다.
            // 메뉴 간 줄바꿈(<br/>)은 유지해서 각 메뉴를 개별 카드로 표시합니다.
            function cleanMealMenu(menu) {
                if (!menu) return '';

                return String(menu)
                    .replace(/<br\s*\/?>/gi, '\n')
                    .split(/\n+/)
                    .map(item => item
                        .replace(/고-자율/g, '')
                        .replace(/\(고\)/g, '')
                        .replace(/\(고/g, '')
                        .replace(/-고/g, '')
                        .replace(/표준/g, '')
                        .replace(/자율/g, '')
                        .replace(/[()]/g, '')
                        .replace(/[0-9]/g, '')
                        .replace(/\./g, '')
                        .replace(/-/g, '')
                        .replace(/\*/g, '')
                        .replace(/&/g, ' · ')
                        .replace(/\s{2,}/g, ' ')
                        .trim()
                    )
                    .filter(Boolean)
                    .join('<br/>');
            }

            function buildMenuList(menu) {
                const menuItems = cleanMealMenu(menu)
                    .split(/<br\s*\/?>/i)
                    .map(v => v.trim())
                    .filter(Boolean);

                const list = document.createElement('div');
                list.className = 'meal-menu-list';

                menuItems.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'meal-menu-item';
                    el.textContent = item;
                    list.appendChild(el);
                });

                return { list, count: menuItems.length };
            }

            async function refreshMealDisplay(force = false) {
                if (!mealDisplayEnabled || currentMode !== 'teacher' || !currentDept) return;

                const target = getMealTarget();

                // label까지 키에 포함하여 23:59 "내일의 중식"이
                // 00:00 이후 "오늘의 중식"으로 정확히 다시 렌더링되도록 합니다.
                const key = `${target.date}_${target.mealType}_${target.label}`;

                if (!force && key === lastMealViewKey) return;
                lastMealViewKey = key;

                setMealLoading(target);

                try {
                    const rows = await ensureMealDate(target.date);
                    const meal = rows.find(row => Number(row.meal_type) === target.mealType) || null;

                    if (meal && meal.is_available !== false) {
                        renderMeal(target, meal);
                        return;
                    }

                    // 현재 끼니가 없는 경우 다음 실제 급식을 탐색해서 함께 표시
                    const nextMeal = await findNextAvailableMeal(target);
                    renderUnavailableMeal(target, nextMeal);

                } catch (err) {
                    console.error('급식 정보 처리 오류:', err);
                    renderMealError(target, err);
                }
            }

            async function getMealsFromDb(dateText) {
                const { data, error } = await _supabase
                    .from('t_meals')
                    .select('*')
                    .eq('meal_date', dateText)
                    .order('meal_type', { ascending: true });

                if (error) throw error;
                return data || [];
            }

            // 특정 날짜는 DB를 우선 사용합니다.
            // 데이터가 없거나, 마지막 갱신 후 6시간 이상 지난 경우에만 NEIS를 다시 확인합니다.
            // 한 태블릿이 갱신하면 updated_at이 최신화되므로 다른 태블릿은 다시 API를 호출하지 않고 DB를 사용합니다.
            function isMealCacheStale(rows) {
                if (!rows || rows.length === 0) return true;

                const latestUpdatedAt = Math.max(
                    ...rows
                        .map(row => new Date(row.updated_at || 0).getTime())
                        .filter(Number.isFinite)
                );

                if (!Number.isFinite(latestUpdatedAt) || latestUpdatedAt <= 0) return true;
                return (Date.now() - latestUpdatedAt) >= MEAL_CACHE_TTL;
            }

            async function ensureMealDate(dateText) {
                let rows = await getMealsFromDb(dateText);

                if (rows.length === 0 || isMealCacheStale(rows)) {
                    await fetchAndCacheMeals(dateText);
                    rows = await getMealsFromDb(dateText);
                }

                return rows;
            }

            // 현재 목표 끼니 이후의 실제 급식을 찾습니다.
            // 중식이 없으면 같은 날 석식부터, 석식이 없으면 다음 날 중식부터 탐색합니다.
            async function findNextAvailableMeal(target) {
                for (let dayOffset = 0; dayOffset <= NEXT_MEAL_SEARCH_DAYS; dayOffset++) {
                    const dateText = addDays(target.date, dayOffset);
                    const rows = await ensureMealDate(dateText);

                    let candidateTypes;
                    if (dayOffset === 0) {
                        candidateTypes = Number(target.mealType) === 2 ? [3] : [];
                    } else {
                        candidateTypes = [2, 3];
                    }

                    for (const type of candidateTypes) {
                        const meal = rows.find(row =>
                            Number(row.meal_type) === type &&
                            row.is_available !== false
                        );

                        if (meal) return meal;
                    }
                }

                return null;
            }

            // DB Cache Miss일 때만 호출되는 NEIS API.
            // 한 날짜를 한 번 조회해서 중식/석식을 동시에 t_meals에 캐시합니다.
            async function fetchAndCacheMeals(dateText) {
                if (!NEIS_API_KEY || NEIS_API_KEY === 'YOUR_NEIS_API_KEY') {
                    throw new Error('NEIS_API_KEY를 설정해 주세요.');
                }

                const ymd = formatNeisDate(dateText);
                const params = new URLSearchParams({
                    KEY: NEIS_API_KEY,
                    Type: 'json',
                    ATPT_OFCDC_SC_CODE: NEIS_OFFICE_CODE,
                    SD_SCHUL_CODE: NEIS_SCHOOL_CODE,
                    MLSV_YMD: ymd
                });

                const response = await fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?${params.toString()}`);
                if (!response.ok) throw new Error(`NEIS API HTTP 오류: ${response.status}`);

                const json = await response.json();
                const apiResult = json.RESULT || json.mealServiceDietInfo?.[0]?.head?.find(x => x.RESULT)?.RESULT;
                const rows = json.mealServiceDietInfo?.find(x => Array.isArray(x.row))?.row || [];

                const records = [];
                const nowIso = new Date().toISOString();

                if (apiResult?.CODE === 'INFO-200' || rows.length === 0) {
                    // 급식 없는 날도 중식/석식을 명시적으로 저장하여 같은 날짜를 다시 API 호출하지 않습니다.
                    records.push(
                        {
                            meal_date: dateText,
                            meal_type: 2,
                            is_available: false,
                            menu: null,
                            calorie: null,
                            nutrition: null,
                            api_status: apiResult?.CODE || 'INFO-200',
                            updated_at: nowIso
                        },
                        {
                            meal_date: dateText,
                            meal_type: 3,
                            is_available: false,
                            menu: null,
                            calorie: null,
                            nutrition: null,
                            api_status: apiResult?.CODE || 'INFO-200',
                            updated_at: nowIso
                        }
                    );
                } else {
                    const mealMap = new Map(rows.map(row => [Number(row.MMEAL_SC_CODE), row]));

                    [2, 3].forEach(type => {
                        const row = mealMap.get(type);

                        if (row) {
                            records.push({
                                meal_date: dateText,
                                meal_type: type,
                                is_available: true,
                                menu: cleanMealMenu(row.DDISH_NM) || null,
                                calorie: row.CAL_INFO || null,
                                nutrition: row.NTR_INFO || null,
                                api_status: 'INFO-000',
                                updated_at: nowIso
                            });
                        } else {
                            records.push({
                                meal_date: dateText,
                                meal_type: type,
                                is_available: false,
                                menu: null,
                                calorie: null,
                                nutrition: null,
                                api_status: 'INFO-200',
                                updated_at: nowIso
                            });
                        }
                    });
                }

                const { error } = await _supabase
                    .from('t_meals')
                    .upsert(records, { onConflict: 'meal_date,meal_type' });

                if (error) throw error;
            }

            function setMealLoading(target) {
                document.getElementById('meal-title').innerText = getMealTitle(target);
                document.getElementById('meal-meta').innerText = '';
                document.getElementById('meal-content').innerHTML =
                    '<div class="meal-loading">급식 정보를 불러오는 중입니다...</div>';
            }

            function renderMeal(target, meal) {
                document.getElementById('meal-title').innerText = getMealTitle(target);
                document.getElementById('meal-meta').innerText =
                    meal?.calorie ? `🔥 ${String(meal.calorie).replace(/Kcal/g, 'kcal')}` : '';

                const content = document.getElementById('meal-content');
                content.innerHTML = '';

                const { list, count } = buildMenuList(meal?.menu);

                if (count === 0) {
                    content.innerHTML = '<div class="meal-empty">등록된 메뉴가 없습니다.</div>';
                    return;
                }

                content.appendChild(list);
            }

            function renderUnavailableMeal(target, nextMeal) {
                document.getElementById('meal-title').innerText = getMealTitle(target);
                document.getElementById('meal-meta').innerText = '';

                const content = document.getElementById('meal-content');
                content.innerHTML = '';

                const noService = document.createElement('div');
                noService.className = 'meal-no-service';
                noService.textContent = `${target.label.replace('오늘의 ', '오늘 ').replace('내일의 ', '내일 ')}은 없습니다.`;
                content.appendChild(noService);

                if (!nextMeal) {
                    const none = document.createElement('div');
                    none.className = 'next-meal-none';
                    none.textContent = '확인 가능한 다음 급식 정보가 없습니다.';
                    content.appendChild(none);
                    return;
                }

                const wrap = document.createElement('div');
                wrap.className = 'next-meal-wrap';

                const header = document.createElement('div');
                header.className = 'next-meal-header';

                const title = document.createElement('div');
                title.className = 'next-meal-title';
                title.textContent = getNextMealTitle(nextMeal);

                const calorie = document.createElement('div');
                calorie.className = 'next-meal-calorie';
                calorie.textContent = nextMeal.calorie ? `🔥 ${String(nextMeal.calorie).replace(/Kcal/g, 'kcal')}` : '';

                header.appendChild(title);
                header.appendChild(calorie);
                wrap.appendChild(header);

                const { list, count } = buildMenuList(nextMeal.menu);

                if (count > 0) {
                    wrap.appendChild(list);
                } else {
                    const none = document.createElement('div');
                    none.className = 'next-meal-none';
                    none.textContent = '등록된 메뉴가 없습니다.';
                    wrap.appendChild(none);
                }

                content.appendChild(wrap);
            }

            function renderMealError(target, err) {
                document.getElementById('meal-title').innerText = getMealTitle(target);
                document.getElementById('meal-meta').innerText = '';

                const safeMessage = err?.message || '알 수 없는 오류';
                document.getElementById('meal-content').innerHTML = `
                    <div class="meal-error">
                        급식 정보를 불러오지 못했습니다.<br>
                        <span style="color:var(--text-dim); font-size:1rem;">${safeMessage}</span>
                    </div>`;
            }

            function renderPartitions(cardW, cardH, gap) {
                const layer = document.getElementById('partition-layer');
                const wrapper = document.getElementById('grid-wrapper');
                layer.innerHTML = '';
                document.querySelectorAll('.partition-trigger').forEach(el => el.remove());
                const thickness = 6;
                const extraLength = 4;
                for (let r = 0; r <= gridRows; r++) {
                    for (let c = 0; c < gridCols; c++) {
                        const id = `r${r}c${c}`;
                        if (currentMode === 'edit') {
                            const trg = document.createElement('div');
                            trg.className = 'partition-trigger';
                            trg.style.left = `${c * (cardW + gap)}px`;
                            trg.style.top = `${r * (cardH + gap) - (gap/2) - 15}px`;
                            trg.style.width = `${cardW}px`; trg.style.height = `30px`;
                            trg.onclick = () => togglePartition('h', id);
                            wrapper.appendChild(trg);
                        }
                        if ((partitions.h || []).includes(id)) {
                            const line = document.createElement('div');
                            line.className = 'partition';
                            line.style.left = `${c * (cardW + gap) - (gap/2) - (extraLength/2)}px`;
                            line.style.top = `${r * (cardH + gap) - (gap/2) - (thickness/2)}px`;
                            line.style.width = `${cardW + gap + extraLength}px`;
                            line.style.height = `${thickness}px`;
                            layer.appendChild(line);
                        }
                    }
                }
                for (let r = 0; r < gridRows; r++) {
                    for (let c = 0; c <= gridCols; c++) {
                        const id = `r${r}c${c}`;
                        if (currentMode === 'edit') {
                            const trg = document.createElement('div');
                            trg.className = 'partition-trigger';
                            trg.style.left = `${c * (cardW + gap) - (gap/2) - 15}px`;
                            trg.style.top = `${r * (cardH + gap)}px`;
                            trg.style.width = `30px`; trg.style.height = `${cardH}px`;
                            trg.onclick = () => togglePartition('v', id);
                            wrapper.appendChild(trg);
                        }
                        if ((partitions.v || []).includes(id)) {
                            const line = document.createElement('div');
                            line.className = 'partition';
                            line.style.left = `${c * (cardW + gap) - (gap/2) - (thickness/2)}px`;
                            line.style.top = `${r * (cardH + gap) - (gap/2) - (extraLength/2)}px`;
                            line.style.width = `${thickness}px`;
                            line.style.height = `${cardH + gap + extraLength}px`;
                            layer.appendChild(line);
                        }
                    }
                }
            }

            function togglePartition(type, id) {
                if (!partitions[type]) partitions[type] = [];
                if (partitions[type].includes(id)) partitions[type] = partitions[type].filter(x => x !== id);
                else partitions[type].push(id);
                renderGrid();
            }

            function openEditModal(r, c, teacher) {
                activeEditCell = { r, c };
                document.getElementById('modal-pos').innerText = `${r + 1}행 ${c + 1}열 설정 중`;
                const dropdown = document.getElementById('teacher-dropdown');
                dropdown.innerHTML = '<option value="">좌석 비우기</option>';
                localTeachers.sort((a,b) => a.name.localeCompare(b.name)).forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.id; opt.innerText = `${t.name} (${t.subject || ''})`;
                    if (teacher && t.id === teacher.id) opt.selected = true;
                    dropdown.appendChild(opt);
                });
                document.getElementById('edit-modal').style.display = 'flex';
            }

            window.closeModal = () => document.getElementById('edit-modal').style.display = 'none';
            window.applyTeacher = function() {
                const selectedId = document.getElementById('teacher-dropdown').value;
                localTeachers.forEach(t => { if(t.row_index === activeEditCell.r && t.col_index === activeEditCell.c) { t.row_index = null; t.col_index = null; } });
                if (selectedId) { const target = localTeachers.find(t => t.id == selectedId); target.row_index = activeEditCell.r; target.col_index = activeEditCell.c; }
                renderGrid(); closeModal();
            };
            window.removeTeacher = function() { 
                localTeachers.forEach(t => { if(t.row_index === activeEditCell.r && t.col_index === activeEditCell.c) { t.row_index = null; t.col_index = null; } });
                renderGrid(); closeModal(); 
            };

            window.updateGridSize = function() {
                gridRows = parseInt(document.getElementById('input-rows').value) || 4;
                gridCols = parseInt(document.getElementById('input-cols').value) || 6;
                renderGrid();
            };

            window.saveAllSettings = async function() {
                showToast("저장 중...");
                await _supabase.from('t_partition').upsert({ dept: currentDept, rows: gridRows, cols: gridCols, partitions: partitions });
                for (const t of localTeachers) await _supabase.from('t_teacher').update({ row_index: t.row_index, col_index: t.col_index }).eq('id', t.id);
                showToast("성공적으로 저장되었습니다.");
            };

            function setRealtimeStatus(status, message) {
                const badge = document.getElementById('realtime-badge');
                const textEl = document.getElementById('realtime-status-text');
                if (!badge || !textEl) return;

                badge.classList.remove(
                    'status-connected',
                    'status-connecting',
                    'status-error',
                    'status-disconnected'
                );
                badge.classList.add(`status-${status}`);
                textEl.innerText = message;
            }

            function startListening() {
                stopListening(false);
                setRealtimeStatus('connecting', '실시간 호출 연결 중...');

                realTimeChannel = _supabase.channel('public:t_calls')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 't_calls' }, payload => {
                        if (payload.new.dept === currentDept) triggerCallEffect(payload.new.name);
                    })
                    .subscribe(status => {
                        if (status === 'SUBSCRIBED') {
                            setRealtimeStatus('connected', '실시간 호출 대기 중');
                        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                            setRealtimeStatus('error', '실시간 연결 오류 · 재연결 필요');
                        } else if (status === 'CLOSED') {
                            setRealtimeStatus('disconnected', '실시간 연결 종료됨');
                        }
                    });
            }

            function stopListening(showStatus = true) {
                if (realTimeChannel) {
                    _supabase.removeChannel(realTimeChannel);
                    realTimeChannel = null;
                }
                if (showStatus) {
                    setRealtimeStatus('disconnected', '실시간 호출 대기 해제');
                }
            }
            
            window.showDashboard = function() { 
                currentDept = null;
                document.getElementById('dashboard-view').style.display = 'block'; 
                document.getElementById('grid-view').style.display = 'none'; 
                document.getElementById('teacher-view').style.display = 'none'; 
                document.getElementById('call-instruction').style.display = 'none';
                lastMealViewKey = '';
                stopListening(); 
            };

            window.switchMode = function(mode) { 
                currentMode = mode;
                document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active')); 
                const btn = document.getElementById(`btn-${mode}`);
                if(btn) btn.classList.add('active'); 
                document.getElementById('edit-header').style.display = (mode === 'edit') ? 'flex' : 'none'; 
                showDashboard(); 
            };

            function showToast(msg) { 
                const t = document.getElementById('toast'); 
                t.innerText = msg; 
                t.style.display = 'block'; 
                setTimeout(() => t.style.display = 'none', 3000);
            }

            function autoScale() { 
                const outer = document.getElementById('grid-outer-container');
                const wrapper = document.getElementById('grid-wrapper'); 
                if (!outer || !wrapper || document.getElementById('grid-view').style.display === 'none') return;
                const scale = Math.min((outer.clientWidth * 0.92) / wrapper.offsetWidth, (outer.clientHeight * 0.92) / wrapper.offsetHeight); 
                wrapper.style.transform = `scale(${scale})`;
            }
        })();
    </script>
</body>
</html>
